title: Sven Lutz
description: Writing and notes on applied AI and research software by Sven Lutz.
url: "https://sven-lutz.github.io"
baseurl: ""
lang: en
timezone: Europe/Berlin

author:
  name: Sven Lutz
  url: https://sven-lutz.github.io

social:
  name: Sven Lutz
  links:
    - https://github.com/Sven-Lutz
    - https://www.linkedin.com/in/lutzsven/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: /blog/:title/
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
