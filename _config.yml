title: Sven Lutz
description: Applied AI and research software — knowledge graphs, retrieval systems and research engineering, written up by Sven Lutz.
url: "https://sven-lutz.github.io"
baseurl: ""
lang: en
timezone: Europe/Berlin

image: /assets/images/og-card.png

author:
  name: Sven Lutz
  url: https://sven-lutz.github.io

social:
  name: Sven Lutz
  links:
    - https://github.com/Sven-Lutz
    - https://www.linkedin.com/in/lutzsven/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  # Short research notes. They render on /log/ as a stream; no separate page
  # per entry, because a two-paragraph note does not need a URL of its own.
  notes:
    output: false

defaults:
  # Social preview card for every page; individual pages can override `image`.
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

feed:
  collections:
    notes:
      path: /feed/notes.xml

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: /blog/:title/
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
