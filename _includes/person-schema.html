{%- comment -%}
Structured data for search engines and profile-aware readers. jekyll-seo-tag
emits the generic page schema; this adds the parts it cannot know: affiliation,
education and subject areas. Only facts stated elsewhere on this site.
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Sven Lutz",
  "url": {{ site.url | append: site.baseurl | append: "/" | jsonify }},
  "image": {{ site.url | append: "/assets/images/portrait.jpg" | jsonify }},
  "affiliation": {
    "@type": "Organization",
    "name": "Karlsruhe Institute of Technology — Institute of Nanotechnology (INT)",
    "url": "https://www.int.kit.edu/"
  },
  "alumniOf": [
    { "@type": "CollegeOrUniversity", "name": "Karlsruhe Institute of Technology" },
    { "@type": "CollegeOrUniversity", "name": "University of Bayreuth" }
  ],
  "knowsAbout": [
    "Applied artificial intelligence",
    "Knowledge graphs",
    "Retrieval-augmented generation",
    "Research software engineering",
    "Time-series forecasting"
  ],
  "sameAs": [
    "https://github.com/Sven-Lutz",
    "https://www.linkedin.com/in/lutzsven/"
  ]
}
</script>
