{% if page.series %}
  {% assign series_posts = site.posts | where: "series", page.series | sort: "series_order" %}
  <nav class="series-nav" aria-label="Article series">
    <h2>Part of the series “{{ page.series }}”</h2>
    <ol>
      {% for post in series_posts %}
        <li{% if post.url == page.url %} aria-current="step"{% endif %}>
          {% if post.url == page.url %}{{ post.title }}{% else %}<a href="{{ post.url | relative_url }}">{{ post.title }}</a>{% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
