<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081a2c">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Sven Lutz, home">
        <span class="wordmark-mark">SL</span><span>Sven Lutz</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/notes/' | relative_url }}">Notes</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <p>Building useful systems at the intersection of AI, research and entrepreneurship.</p>
      <div class="footer-links">
        <a href="https://github.com/Sven-Lutz">GitHub</a>
        <a href="https://www.linkedin.com/in/lutzsven/">LinkedIn</a>
        <a href="mailto:Lutz.sven@outlook.de">Email</a>
      </div>
      <p class="fine-print">© {{ 'now' | date: '%Y' }} Sven Lutz</p>
    </footer>
  </body>
</html>
